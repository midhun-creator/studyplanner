<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">StudyPlanner</title>
<desc id="d">StudyPlanner: plan, focus, revise, repeat. An animated Pomodoro ring counts down beside floating feature tags.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00261f"/><stop offset=".55" stop-color="#004d40"/><stop offset="1" stop-color="#00796b"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity=".10"/></pattern>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe082"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.title{font-size:76px;font-weight:800;fill:#fff;letter-spacing:-2px}
.title tspan{fill:#ffd54f}
.tag{font-size:20px;fill:#b2dfdb;font-weight:500}
.w{font-size:44px;font-weight:700;fill:#ffd54f;opacity:0}
@keyframes wrot{0%{opacity:0;transform:translateY(14px)}4%,22%{opacity:1;transform:translateY(0)}26%,100%{opacity:0;transform:translateY(-14px)}}
.w0{animation:wrot 8s infinite;animation-delay:0s}
.w1{animation:wrot 8s infinite;animation-delay:2s}
.w2{animation:wrot 8s infinite;animation-delay:4s}
.w3{animation:wrot 8s infinite;animation-delay:6s}

.d{font-size:46px;font-weight:800;fill:#fff;text-anchor:middle;opacity:0;font-variant-numeric:tabular-nums}
@keyframes dshow{0%,15%{opacity:1}16.6%,100%{opacity:0}}
.d0{animation:dshow 9s infinite;animation-delay:0.0s}
.d1{animation:dshow 9s infinite;animation-delay:1.5s}
.d2{animation:dshow 9s infinite;animation-delay:3.0s}
.d3{animation:dshow 9s infinite;animation-delay:4.5s}
.d4{animation:dshow 9s infinite;animation-delay:6.0s}
.d5{animation:dshow 9s infinite;animation-delay:7.5s}

.sub{font-size:14px;fill:#80cbc4;text-anchor:middle;letter-spacing:3px;font-weight:700}
.prog{stroke-dasharray:578.1;stroke-dashoffset:578.1;animation:fill 9s linear infinite;transform:rotate(-90deg);transform-origin:970px 170.0px}
@keyframes fill{0%{stroke-dashoffset:578.1}100%{stroke-dashoffset:0}}
.chip rect{fill:#ffffff;fill-opacity:.10;stroke:#ffffff;stroke-opacity:.28}
.chip text{font-size:13.5px;font-weight:600;fill:#e0f2f1;text-anchor:middle}
.pulse{animation:pulse 3s ease-in-out infinite;transform-origin:970px 170.0px}
@keyframes pulse{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.34;transform:scale(1.05)}}
</style>
<rect width="1200" height="340" rx="22" fill="url(#bg)"/>
<rect width="1200" height="340" rx="22" fill="url(#dots)"/>
<circle class="pulse" cx="970" cy="170.0" r="126" fill="#ffd54f" fill-opacity=".18"/>
<circle cx="970" cy="170.0" r="92" fill="#00382f" fill-opacity=".85" stroke="#ffffff" stroke-opacity=".16" stroke-width="14"/>
<circle class="prog" cx="970" cy="170.0" r="92" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
<text class="d d0" x="970" y="184.0">25:00</text>
<text class="d d1" x="970" y="184.0">20:00</text>
<text class="d d2" x="970" y="184.0">15:00</text>
<text class="d d3" x="970" y="184.0">10:00</text>
<text class="d d4" x="970" y="184.0">05:00</text>
<text class="d d5" x="970" y="184.0">00:00</text>

<text class="sub" x="970" y="218.0">FOCUS</text>
<text class="title" x="80" y="118.0">Study<tspan>Planner</tspan></text>
<text class="tag" x="80" y="158.0">Your smart study companion, installable and offline-ready.</text>
<text class="w w0" x="80" y="236.0">plan.</text>
<text class="w w1" x="80" y="236.0">focus.</text>
<text class="w w2" x="80" y="236.0">revise.</text>
<text class="w w3" x="80" y="236.0">repeat.</text>

<g transform="translate(745,65.0)"><g class="chip"><rect x="-55.0" y="-15" width="110.0" height="30" rx="15"/><text x="0" y="5">Flashcards</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="5s" begin="-0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;.5;1"/></g></g>
<g transform="translate(770,170.0)"><g class="chip"><rect x="-71.39999999999999" y="-15" width="142.79999999999998" height="30" rx="15"/><text x="0" y="5">Exam timetable</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="5s" begin="-1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;.5;1"/></g></g>
<g transform="translate(745,275.0)"><g class="chip"><rect x="-55.0" y="-15" width="110.0" height="30" rx="15"/><text x="0" y="5">Attendance</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="5s" begin="-2.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;.5;1"/></g></g>
<g transform="translate(1125,55.0)"><g class="chip"><rect x="-46.8" y="-15" width="93.6" height="30" rx="15"/><text x="0" y="5">AI tutor</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="5s" begin="-0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;.5;1"/></g></g>
<g transform="translate(1120,285.0)"><g class="chip"><rect x="-42.699999999999996" y="-15" width="85.39999999999999" height="30" rx="15"/><text x="0" y="5">Streaks</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="5s" begin="-1.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;.5;1"/></g></g>

</svg>
